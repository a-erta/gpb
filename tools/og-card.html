<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#07070b;color:#f3f1ea;font-family:"Inter Tight",sans-serif;position:relative;overflow:hidden}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 50% 45%,rgba(143,123,255,.28),transparent 70%)}
.tick{position:absolute;top:0;left:0;right:0;height:52px;border-bottom:1px solid #25253a;background:#000;font:500 19px "JetBrains Mono",monospace;display:flex;align-items:center;gap:34px;padding:0 34px;white-space:nowrap}
.up{color:#3ee08f}.down{color:#ff5d6c}
.wrap{position:absolute;top:52px;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{font-weight:800;font-size:220px;letter-spacing:-.06em;line-height:.85;padding:0 .08em;background:linear-gradient(100deg,#f5c451 0%,#ff7ab6 45%,#8f7bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-weight:500;font-size:50px;letter-spacing:-.02em;margin-top:18px}
h2 i{font-family:"Instrument Serif",serif;font-weight:400}
.ex{margin-top:34px;font-size:27px;color:#9a98ad;display:flex;gap:18px;align-items:center}
.ex s{text-decoration-color:#ff5d6c}
.ex b{font-family:"Instrument Serif",serif;font-weight:400;font-size:33px;color:#f3f1ea}
.url{position:absolute;right:40px;bottom:30px;font:500 22px "JetBrains Mono",monospace;color:#f5c451}
.pill{position:absolute;left:40px;bottom:30px;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:#f5c451;border:1px solid #25253a;border-radius:99px;padding:8px 16px}
</style></head><body>
<div class="tick"><span>$HYPE <span class="up">▲ 412.7%</span></span><span>$DELIVERY <span class="down">▼ 100%</span></span><span>$GUIDANCE withdrawn</span><span>$TOKENS <span class="up">▲ ∞</span></span><span>$LEGACY <span class="down">▼ 98%</span></span><span>$FOUNDERMODE <span class="up">▲ 61%</span></span></div>

</div>

<div class="url">gpb.news</div>
</body></html>
